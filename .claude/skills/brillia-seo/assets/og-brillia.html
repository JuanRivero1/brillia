<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Inter:wght@500;600&display=block">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif;background:#f8fafc;position:relative;color:#0f172a}
.b{position:absolute;border-radius:50%;filter:blur(70px)}
.b1{width:520px;height:520px;background:#5eead4;top:-180px;left:-140px;opacity:.7}
.b2{width:460px;height:460px;background:#a3e635;bottom:-220px;right:60px;opacity:.45}
.b3{width:340px;height:340px;background:#93c5fd;top:120px;right:-120px;opacity:.6}
.c{position:absolute;inset:0;padding:70px 80px;display:flex;flex-direction:column;justify-content:space-between}
.logo{display:flex;align-items:center;gap:18px;font-family:Outfit;font-weight:800;font-size:48px;letter-spacing:-.02em}
h1{font-family:Outfit;font-weight:800;font-size:84px;line-height:1.02;letter-spacing:-.03em}
h1 em{font-style:normal;background:linear-gradient(120deg,#0ea5a4,#0f766e 60%,#65a30d);-webkit-background-clip:text;color:transparent}
.sub{font-size:30px;font-weight:600;color:#0f766e;margin-bottom:18px}
.pie{display:flex;gap:16px;font-size:24px;font-weight:600}
.pie span{background:#fff;border:1px solid #e2e8f0;border-radius:999px;padding:12px 22px;box-shadow:0 10px 30px -14px rgba(15,23,42,.3)}
.pie .wa{background:#25d366;color:#fff;border-color:#25d366}
.chispa{position:absolute;right:110px;top:90px;font-size:120px}
</style></head><body>
<div class="b b1"></div><div class="b b2"></div><div class="b b3"></div>
<div class="chispa">✨</div>
<div class="c">
  <div class="logo"><svg viewBox="0 0 40 40" width="64" height="64"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0ea5a4"/></linearGradient></defs><circle cx="20" cy="20" r="19" fill="url(#g)"/><path d="M20 8l2.6 7.4L30 18l-7.4 2.6L20 28l-2.6-7.4L10 18l7.4-2.6z" fill="#fff"/><circle cx="29" cy="11" r="2" fill="#fff" opacity=".8"/></svg>Brillia</div>
  <div><p class="sub">Limpieza profesional en Madrid</p><h1>Tu espacio,<br><em>como nuevo</em>.</h1></div>
  <div class="pie"><span>🏠 Hogares · 🏢 Oficinas · 🏗️ Fin de obra</span><span class="wa">WhatsApp 649 671 247</span></div>
</div></body></html>
